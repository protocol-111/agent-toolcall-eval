apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: toolcall-eval-results
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # k3s ships local-path as the default StorageClass; leave storageClassName
  # unset to use it, or set it explicitly for your cluster.
